<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Semáforo de viajes</title>
<style>
:root{--bg:#f2f2f0;--fg:#161616;--card:#fff;--line:#d9d9d4;--mut:#6b6b66;--ok:#12a150;--bad:#d92d20;--idle:#8a8a85;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#f1f1ee;--card:#1d1d1d;--line:#333;--mut:#a0a09a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;font-size:18px;padding:12px;max-width:480px;margin:0 auto}
.light{border-radius:20px;padding:26px 16px;text-align:center;color:#fff;background:var(--idle);transition:background .15s}
.light.ok{background:var(--ok)}.light.bad{background:var(--bad)}
.light .big{font-size:60px;font-weight:700;line-height:1;margin:0}
.light .sub{font-size:24px;margin:8px 0 0}
.light .sub2{font-size:16px;opacity:.9;margin:6px 0 0}
#mic{font:inherit;font-size:30px;width:100%;margin-top:12px;padding:22px;border:0;border-radius:16px;background:var(--ok);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label{display:block;font-size:15px;color:var(--mut);margin-bottom:4px}
input{width:100%;font:inherit;font-size:22px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus{outline:3px solid var(--ok);outline-offset:1px}
h2{font-size:17px;margin:0 0 8px;font-weight:600}
.detail{font-size:16px;color:var(--mut);line-height:1.5}
.detail b{color:var(--fg)}
</style>
</head>
<body>
<div id="light" class="light"><p class="big" id="verdict">Toca Hablar</p><p class="sub" id="perMin"></p><p class="sub2" id="goal"></p></div>

<button id="mic">🎤 Hablar</button>
<p id="heard" class="detail" style="margin:8px 2px 0">Di: «27 minutos, 19 coma 9 kilómetros, precio 4869». Te responde «Aceptar» o «No aceptar».</p>

<div class="card">
<h2>Datos del viaje (se llenan solos)</h2>
<div class="row">
<div><label for="mins">Min totales</label><input id="mins" type="number" inputmode="decimal"></div>
<div><label for="km">Km totales</label><input id="km" type="number" inputmode="decimal"></div>
<div><label for="fare">Precio ($)</label><input id="fare" type="number" inputmode="decimal"></div>
</div>
</div>

<div class="card">
<h2>Mis metas</h2>
<div class="row" style="grid-template-columns:1fr 1fr">
<div><label for="goalIn">Meta por min ($)</label><input id="goalIn" type="number" inputmode="decimal" value="200"></div>
<div><label for="kmCost">Costo por km ($)</label><input id="kmCost" type="number" inputmode="decimal" value="100"></div>
</div>
</div>

<div class="card detail" id="detail">Ganancia neta = precio − km totales × costo por km. Se divide por los minutos totales y se compara con tu meta.</div>

<script>
const $=id=>document.getElementById(id);
const n=id=>parseFloat(String($(id).value).replace(",","."))||0;
const fmt=x=>"$"+Math.round(x).toLocaleString("es-CL");
try{const s=JSON.parse(localStorage.getItem("meta")||"{}");if(s.goalIn)$("goalIn").value=s.goalIn;if(s.kmCost)$("kmCost").value=s.kmCost}catch(e){}
function calc(){
  const mins=n("mins"),km=n("km"),fare=n("fare"),goal=n("goalIn"),kc=n("kmCost");
  try{localStorage.setItem("meta",JSON.stringify({goalIn:$("goalIn").value,kmCost:$("kmCost").value}))}catch(e){}
  const L=$("light");
  if(mins<=0||fare<=0){L.className="light";$("verdict").textContent="Toca Hablar";$("perMin").textContent="";$("goal").textContent="";return}
  const net=fare-km*kc,pm=net/mins,ok=pm>=goal;
  L.className="light "+(ok?"ok":"bad");
  $("verdict").textContent=ok?"ACEPTAR":"NO ACEPTAR";
  $("perMin").textContent=fmt(pm)+" por minuto";
  $("goal").textContent="Meta: "+fmt(goal)+" por minuto";
  $("detail").innerHTML="Costo de km: <b>"+fmt(km*kc)+"</b><br>Ganancia neta: <b>"+fmt(net)+"</b><br>Precio mínimo para tu meta: <b>"+fmt(goal*mins+km*kc)+"</b>";
}
["mins","km","fare","goalIn","kmCost"].forEach(i=>$(i).addEventListener("input",calc));

const WORDS={cero:0,uno:1,un:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,veinte:20,treinta:30,cuarenta:40,cincuenta:50,sesenta:60};
function num(x){return /^\d{1,3}(\.\d{3})+$/.test(x)?parseFloat(x.replace(/\./g,"")):parseFloat(x.replace(",","."))}
function parseTrip(t){
  t=t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  t=t.replace(/(\d)\s*(coma|punto)\s*(\d)/g,"$1.$3");
  t=t.replace(/\b(cero|uno|un|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|veinte|treinta|cuarenta|cincuenta|sesenta)\b/g,w=>WORDS[w]);
  t=t.replace(/(\d+)\s*mil\b/g,(m,x)=>String(parseInt(x,10)*1000));
  const r={mins:null,km:null,fare:null};
  let fareNext=false;
  const re=/(\d+(?:[.,]\d+)*)\s*(minutos?|mins?|kilometros?|kms?)?|(precio|tarifa|valor|pago)/g;
  for(const m of t.matchAll(re)){
    if(m[1]===undefined){fareNext=true;continue}
    const v=num(m[1]);
    if(fareNext){r.fare=v;fareNext=false;continue}
    let u=m[2]?(m[2][0]==="m"?"m":"k"):null;
    if(!u){
      if(v>=500){r.fare=v;continue}
      u=r.mins===null?"m":"k";
    }
    if(u==="m"&&r.mins===null)r.mins=v;
    else if(u==="k"&&r.km===null)r.km=v;
  }
  return r;
}
function dedupe(t){
  let w=t.split(/\s+/).filter(Boolean),ch=true;
  while(ch){
    ch=false;
    for(let len=Math.floor(w.length/2);len>=3&&!ch;len--){
      for(let i=0;i+2*len<=w.length;i++){
        if(w.slice(i,i+len).join(" ").toLowerCase()===w.slice(i+len,i+2*len).join(" ").toLowerCase()){w.splice(i+len,len);ch=true;break}
      }
    }
  }
  return w.join(" ");
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const SL=["mins","km","fare"];
const NAMES={mins:"los minutos",km:"los kilómetros",fare:"el precio"};
let rec=null,listening=false,done=true,acc="",sess="",tSil=null,tNo=null,wake=null;
const full=()=>dedupe((acc+" "+sess).trim());
const complete=r=>SL.every(k=>r[k]!==null);
function say(txt){
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="es-CL";u.rate=1.1;speechSynthesis.speak(u)}catch(e){}
}
function announce(){
  const ok=$("light").classList.contains("ok");
  const pm=$("perMin").textContent.split(" por")[0].replace("$","").replace(/\./g,"");
  say((ok?"Aceptar. ":"No aceptar. ")+pm+" pesos por minuto");
}
function ui(){
  const b=$("mic");
  b.textContent=listening?"🎤 Escuchando… (toca al terminar)":"🎤 Hablar";
  b.style.background=listening?"var(--fg)":"var(--ok)";
  b.style.color=listening?"var(--bg)":"#fff";
}
function fill(){
  const t=full(),r=parseTrip(t),f=x=>x===null?"—":x;
  SL.forEach(k=>{$(k).value=r[k]===null?"":r[k]});
  $("heard").textContent=t?"Escuché: «"+t+"»  →  "+f(r.mins)+" min · "+f(r.km)+" km · precio "+f(r.fare):"Habla ahora…";
  calc();return r;
}
function schedule(){
  clearTimeout(tSil);
  tSil=setTimeout(finish,complete(parseTrip(full()))?1000:3000);
}
function finish(){
  if(done)return;
  done=true;clearTimeout(tSil);clearTimeout(tNo);
  try{rec.stop()}catch(e){}
  listening=false;ui();
  try{wake&&wake.release()}catch(e){}
  const t=full();
  if(!t){$("heard").textContent="No te escuché. Toca Hablar otra vez.";say("No te escuché");return}
  const r=fill();
  if(complete(r))announce();
  else say("Faltan datos: "+SL.filter(k=>r[k]===null).map(k=>NAMES[k]).join(" y ")+". Repite.");
}
function begin(){
  rec=new SR();rec.lang="es-CL";rec.continuous=false;rec.interimResults=false;rec.maxAlternatives=1;
  rec.onresult=e=>{
    const x=e.results[e.results.length-1][0].transcript.trim();
    const A=acc.toLowerCase(),X=x.toLowerCase();
    if(A&&X.startsWith(A)){acc="";sess=x}
    else if(A&&A.endsWith(X))sess="";
    else sess=x;
    fill();schedule();
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed"||e.error==="service-not-allowed"){
      done=true;clearTimeout(tSil);clearTimeout(tNo);listening=false;ui();
      $("heard").textContent="Permiso de micrófono denegado. Actívalo en los ajustes del sitio.";
    }else if(e.error==="network"){
      done=true;clearTimeout(tSil);clearTimeout(tNo);listening=false;ui();
      $("heard").textContent="Sin internet para el dictado. Toca Hablar otra vez.";
    }
  };
  rec.onend=()=>{acc=full();sess="";if(!done)setTimeout(begin,150)};
  try{rec.start()}catch(e){}
}
$("mic").addEventListener("click",async()=>{
  if(!SR){$("heard").textContent="Este navegador no permite dictado. Usa Chrome en Android.";return}
  if(listening){finish();return}
  try{speechSynthesis.cancel()}catch(e){}
  acc="";sess="";done=false;listening=true;ui();fill();
  try{wake=await navigator.wakeLock.request("screen")}catch(e){}
  clearTimeout(tNo);tNo=setTimeout(()=>{if(!full())finish()},8000);
  begin();
});
calc();
</script>
</body>
</html>
